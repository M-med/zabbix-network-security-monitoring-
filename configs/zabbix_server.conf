# ===========================================
# Zabbix Server Configuration
# Project: Zabbix Network Security Monitoring
# Author: M-Med M2M 
# Version: 7.0
# ===========================================

############ GENERAL PARAMETERS ############

# Unique Zabbix server name
Hostname=Zabbix server

# Listen IP (0.0.0.0 for all interfaces)
ListenIP=0.0.0.0

# Zabbix server listening port
ListenPort=10051

# Log file location
LogFile=/var/log/zabbix/zabbix_server.log

# Maximum log file size (in MB, 0 = unlimited)
LogFileSize=0

# Debug level (0 = basic information)
DebugLevel=3

# PID file
PidFile=/run/zabbix/zabbix_server.pid

# Socket directory
SocketDir=/run/zabbix

# User and group
User=zabbix
Group=zabbix

############ DATABASE PARAMETERS ############

# Database type (MySQL, PostgreSQL, SQLite3)
DBHost=localhost
DBName=zabbix
DBUser=zabbix
DBPassword=zabbix_password
DBPort=3306

# Maximum number of database connections
StartDBSyncers=4

# History cache size (in MB)
HistoryCacheSize=16M

# History index cache size (in MB)
HistoryIndexCacheSize=4M

# Value cache size (in MB)
ValueCacheSize=8M

############ TIMEOUTS ############

# Check timeout (in seconds)
Timeout=4

# Trapper timeout (in seconds)
TrapperTimeout=300

# Unreachable period
UnreachablePeriod=45

# Delay before marking a host as unavailable
UnavailableDelay=60

# Unreachable delay
UnreachableDelay=15

############ TRAFFIC ############

# Maximum concurrent checks per poller
MaxConcurrentChecksPerPoller=1000

# Number of pollers for passive checks
StartPollers=5

# Number of pollers for unreachable checks
StartPollersUnreachable=1

# Number of trappers
StartTrappers=5

# Number of pingers (ICMP)
StartPingers=1

# Number of discoverers
StartDiscoverers=1

# Number of HTTP pollers
StartHTTPPollers=1

# Number of Java pollers
StartJavaPollers=0

# Number of VMware collectors
StartVMwareCollectors=0

# Number of SNMP trappers
StartSNMPTrapper=0

############ SECURITY ############

# Enable/disable active checks
StartAgents=0

# Restrict system commands (whitelist)
# EnableRemoteCommands=0
# SystemRunCommand=1

# Allowed keys (whitelist)
# AllowKey=system.run[*]
# DenyKey=system.run[*]

############ MODULES ############

# Module loading
# LoadModule=module.so
# LoadModulePath=/usr/lib/zabbix/modules

############ FRONTEND ############

# Frontend URL (for notifications)
# FrontendURL=http://192.168.1.14/zabbix

############ ADVANCED ############

# Configuration cache size (in MB)
CacheSize=32M

# Value cache size (in MB)
ValueCacheSize=8M

# Number of workers for configuration sync
StartDBSyncers=4

# Number of discovery processes
StartDiscoverers=1

# Configuration update interval (in seconds)
ConfigFrequency=60

# Housekeeping frequency (in seconds)
HousekeepingFrequency=1

# Maximum number of rows to delete per housekeeping cycle
MaxHousekeeperDelete=5000

# History data compression
# HistoryStorageURL=elasticsearch
# HistoryStorageTypes=uint,dbl,str,log,text
# HistoryStorageDateIndex=1

# Enable slow query logging
# LogSlowQueries=3000

############ EXPORT ############

# Configuration export
# ExportDir=/var/lib/zabbix/export
# ExportFileSize=1G
# ExportType=json

############ SNMP ############

# SNMP trapper
# StartSNMPTrapper=0
# SNMPTrapperFile=/var/log/snmptrap/snmptrap.log

############ PROXY ############

# Proxy mode
# ProxyMode=0
# ProxyLocalBuffer=0
# ProxyOfflineBuffer=1
# DataSenderFrequency=1

############ AUTOREGISTRATION ############

# Auto-registration
# Autoregistration=0
# AutoregistrationActive=0

############ HIGH AVAILABILITY ############

# Zabbix cluster
# NodeAddress=192.168.1.14:10051
# NodeName=zabbix-node-1

############ MISCELLANEOUS ############

# Number of workers for synchronization
StartDiscoverers=1

# Number of timer processes
StartTimers=1

# Number of escalator processes
StartEscalators=1

# Number of alerter processes
StartAlerters=3

# Number of pollers for internal checks
StartPollers=5

# Number of pollers for unreachable checks
StartPollersUnreachable=1

# Number of trappers
StartTrappers=5

# Number of pingers
StartPingers=1

# Number of discoverers
StartDiscoverers=1

# Number of HTTP pollers
StartHTTPPollers=1
