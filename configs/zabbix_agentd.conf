# ===========================================
# Zabbix Agent Configuration
# Project: Zabbix Network Security Monitoring
# Author: M-Med M2M 
# Version: 7.0
# ===========================================

############ GENERAL PARAMETERS ############

# PID file
PidFile=/run/zabbix/zabbix_agentd.pid

# Log file
LogFile=/var/log/zabbix/zabbix_agentd.log

# Maximum log file size (0 = unlimited)
LogFileSize=0

# Debug level (0 = basic information)
DebugLevel=3

# Maximum number of child processes
StartAgents=3

# Active checks refresh interval (in seconds)
RefreshActiveChecks=120

# Buffer send interval
BufferSend=5

# Maximum buffer size
BufferSize=100

# Maximum lines per second
MaxLinesPerSecond=20

# Timeout (in seconds)
Timeout=3

############ PASSIVE CHECKS ############

# Listen IP (0.0.0.0 for all interfaces)
ListenIP=0.0.0.0

# Listen port
ListenPort=10050

# Servers allowed to query the agent (whitelist)
Server=192.168.1.14

# Servers allowed for active checks
ServerActive=192.168.1.14

# Hostname (must match the name in Zabbix)
Hostname=Windows10

# Unique hostname (if different from Hostname)
# HostnameItem=system.hostname

# Host metadata
# HostMetadata=
# HostMetadataItem=

# Host metadata refresh interval
# HostMetadataRefresh=3600

############ ACTIVE CHECKS ############

# Active checks refresh interval
RefreshActiveChecks=120

# Buffer size
BufferSize=100

# Maximum lines per second
MaxLinesPerSecond=20

# Buffer send interval
BufferSend=5

############ ADVANCED PARAMETERS ############

# Key aliases
# Alias=key:alias

# Check timeout
Timeout=3

# Number of retries for active checks
# StartAgents=3

# Enable remote commands (whitelist)
# EnableRemoteCommands=0

# Slow query log interval (in ms)
# LogSlowQueries=3000

############ USER PARAMETERS ############

# Custom user parameters
# UserParameter=custom.key[*],command

# Example: monitor disk space
# UserParameter=disk.space[*],df -h / | tail -1 | awk '{print $5}' | sed 's/%//'

# Example: monitor process count
# UserParameter=process.count[*],ps aux | grep -c "$1"

# Example: monitor memory
# UserParameter=memory.used,free | grep Mem | awk '{print $3/$2 * 100.0}'

############ TLS ############

# TLS configuration (for secure connections)
# TLSConnect=unencrypted
# TLSAccept=unencrypted
# TLScaFile=
# TLSCertFile=
# TLSKeyFile=
# TLSPSKFile=
# TLSPSKIdentity=

############ INCLUDES ############

# Include additional configuration files
Include=/etc/zabbix/zabbix_agentd.d/*.conf

############ WINDOWS SPECIFIC ############

# For Windows: scripts path
# Include=C:\Program Files\Zabbix Agent\zabbix_agentd.d\*.conf

# For Windows: enable active checks
# StartAgents=3

# For Windows: hostname
# Hostname=DESKTOP-916SGV2

# For Windows: Zabbix server
# Server=192.168.1.14
# ServerActive=192.168.1.14

# For Windows: listen port
# ListenPort=10050

# For Windows: listen IP
# ListenIP=0.0.0.0
